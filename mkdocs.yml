site_name: metadexer
site_description: >-
  Content-addressed asset management with deep metadata search,
  hybrid storage routing, and temporal observation tracking.
site_url: https://shruggietech.github.io/metadexer/
docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.instant
    - search.highlight
    - content.tabs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Overview: user-guide/index.md
      - CLI Reference: user-guide/cli-reference.md
      - Configuration: user-guide/configuration.md
      - Platform Notes: user-guide/platform-notes.md
  - Changelog: changelog.md
